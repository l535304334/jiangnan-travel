name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: smart_travel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/init.sql
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/seed_data.sql
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/test_accounts.sql
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/migration_v1.2.sql
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/migration_state_machine.sql
          mysql -h 127.0.0.1 -u root -proot smart_travel < jiangnan-travel/src/main/resources/sql/migration_optimize.sql

      - name: Build backend
        run: mvn -B -f jiangnan-travel/pom.xml clean compile

      - name: Run backend tests
        run: mvn -B -f jiangnan-travel/pom.xml test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: smart_travel
          DB_USER: root
          DB_PASS: root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jiangnan-travel-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: jiangnan-travel-web

      - name: Run frontend tests
        run: npm test
        working-directory: jiangnan-travel-web

      - name: Build frontend
        run: npm run build
        working-directory: jiangnan-travel-web
